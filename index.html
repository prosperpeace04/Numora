<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numora</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A65D46">
<style>
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #F5F5F5; }
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    background: #fff;
    color: #171717;
  }
</style>
</head>
<body>
  <div>Loading…</div>

<script>
  // Register the service worker unconditionally, on every page, regardless
  // of login state — this is what makes the browser offer "Install app" /
  // "Add to Home screen" at all.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch((err) => console.error('SW registration failed:', err));
  }
</script>
<script type="module">
  import { auth } from '/src/auth-client.js';

  // If the user is already signed in, send them straight to the dashboard.
  // Otherwise send them to sign up / sign in. This is the only job this
  // page has, it's not meant to be seen for more than a moment.
  (async () => {
    try {
      const { data } = await auth.token();
      window.location.href = data?.token ? '/numora-dashboard.html' : '/auth.html';
    } catch (err) {
      // auth.token() throws (rather than returning null data) when there's
      // no signed-in session — which is the normal case for a new visitor.
      // That was going uncaught before, crashing this page for anyone not
      // already logged in. Catch it and just send them to sign up/in.
      window.location.href = '/auth.html';
    }
  })();
</script>
</body>
</html>
