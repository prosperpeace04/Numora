<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numora — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
  :root {
    --bg: #FFFFFF; --card: #FFFFFF; --text: #171717; --brand: #A65D46; --border: #EAEAEA; --muted: #71717A;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#111; --text:#F5F5F5; --brand:#C17A60; --border:#292929; --muted:#A1A1AA; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Space Grotesk',sans-serif; padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px)); }
  h1 { font-size:22px; margin-bottom:4px; }
  .subtext { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  input, button { font-family:'Space Grotesk',sans-serif; font-size:15px; }
  input { width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); margin-bottom:10px; }
  button.action { width:100%; padding:12px; border-radius:8px; border:none; background:var(--brand); color:#fff; font-weight:700; cursor:pointer; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .stat-num { font-size:28px; font-weight:700; color:var(--brand); }
  .stat-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; }
  .bar-day { width:70px; color:var(--muted); flex-shrink:0; }
  .bar-track { flex:1; background:var(--border); border-radius:3px; height:14px; overflow:hidden; }
  .bar-fill { background:var(--brand); height:100%; }
  .bar-count { width:24px; text-align:right; }
  .color-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .color-row label { flex:1; font-size:13px; }
  .color-row input[type=color] { width:44px; height:36px; padding:2px; margin:0; }
  .hidden { display:none; }
  #status { font-size:13px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>

  <div id="gate">
    <h1>Numora Admin</h1>
    <div class="subtext">Enter the admin password</div>
    <div class="card">
      <input type="password" id="pw-input" placeholder="Password">
      <button class="action" onclick="login()">Enter</button>
      <div id="gate-error" style="color:#C44; font-size:13px; margin-top:8px;"></div>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <h1>Numora Admin</h1>
    <div class="subtext">App overview</div>

    <div class="stat-grid">
      <div class="card"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total Users</div></div>
      <div class="card"><div class="stat-num" id="stat-active">—</div><div class="stat-label">Active (7d)</div></div>
      <div class="card"><div class="stat-num" id="stat-lookups">—</div><div class="stat-label">Total Lookups</div></div>
      <div class="card"><div class="stat-num" id="stat-errors">See Vercel</div><div class="stat-label">Errors</div></div>
    </div>

    <div class="card">
      <div style="font-weight:700; margin-bottom:10px;">Signups — last 14 days</div>
      <div id="chart-signups"></div>
    </div>

    <div class="card">
      <div style="font-weight:700; margin-bottom:10px;">Lookups — last 14 days</div>
      <div id="chart-lookups"></div>
    </div>

    <div class="card">
      <div style="font-weight:700; margin-bottom:10px;">Theme Colors</div>
      <div class="subtext" style="margin-bottom:12px;">Changes apply live to the app on next page load.</div>
      <div id="color-editor"></div>
      <div id="status"></div>
    </div>
  </div>

<script>
  let adminPassword = sessionStorage.getItem('numora_admin_pw') || '';

  async function login() {
    const pw = document.getElementById('pw-input').value;
    let res;
    try {
      res = await fetch('/api/stats', { headers: { 'X-Admin-Password': pw } });
    } catch (err) {
      document.getElementById('gate-error').textContent = 'Network error: ' + err.message;
      return;
    }
    if (!res.ok) {
      const body = await res.text();
      document.getElementById('gate-error').textContent = `Error ${res.status}: ${body}`;
      return;
    }
    adminPassword = pw;
    sessionStorage.setItem('numora_admin_pw', pw);
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadStats();
    loadConfig();
  }

  // skip the gate if already entered this session
  if (adminPassword) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadStats();
    loadConfig();
  }

  function renderBars(containerId, data) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if (!data.length) {
      container.innerHTML = '<div class="subtext">No data yet.</div>';
      return;
    }
    const max = Math.max(...data.map(d => d.count), 1);
    data.forEach(d => {
      const pct = Math.round((d.count / max) * 100);
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `<div class="bar-day">${d.day.slice(5)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-count">${d.count}</div>`;
      container.appendChild(row);
    });
  }

  async function loadStats() {
    const res = await fetch('/api/stats', { headers: { 'X-Admin-Password': adminPassword } });
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('stat-total').textContent = data.totalUsers;
    document.getElementById('stat-active').textContent = data.activeUsers;
    document.getElementById('stat-lookups').textContent = data.totalLookups;
    renderBars('chart-signups', data.signupsByDay);
    renderBars('chart-lookups', data.lookupsByDay);
  }

  const COLOR_KEYS = [
    ['brand_light', 'Brand (Light)'], ['brand_dark', 'Brand (Dark)'],
    ['bg_light', 'Background (Light)'], ['bg_dark', 'Background (Dark)'],
    ['card_light', 'Card (Light)'], ['card_dark', 'Card (Dark)'],
    ['text_light', 'Text (Light)'], ['text_dark', 'Text (Dark)'],
    ['border_light', 'Border (Light)'], ['border_dark', 'Border (Dark)'],
  ];

  async function loadConfig() {
    const res = await fetch('/api/config');
    if (!res.ok) return;
    const config = await res.json();
    const editor = document.getElementById('color-editor');
    editor.innerHTML = '';
    COLOR_KEYS.forEach(([key, label]) => {
      const row = document.createElement('div');
      row.className = 'color-row';
      row.innerHTML = `<label>${label}</label><input type="color" value="${config[key] || '#A65D46'}" data-key="${key}">`;
      row.querySelector('input').addEventListener('change', (e) => updateColor(key, e.target.value));
      editor.appendChild(row);
    });
  }

  async function updateColor(key, value) {
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Saving…';
    const res = await fetch('/api/config', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
      body: JSON.stringify({ key, value }),
    });
    statusEl.textContent = res.ok ? 'Saved.' : 'Failed to save.';
  }
</script>

</body>
</html>
